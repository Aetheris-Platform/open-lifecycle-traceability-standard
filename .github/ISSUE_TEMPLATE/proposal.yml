name: Proposal
description: Propose a change to OLTS behavior, structure, docs, governance, or examples.
title: "Proposal: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should OLTS solve or clarify?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the proposed change and affected files or concepts.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
      description: Does this affect adopters, conformance levels, schemas, examples, or tooling?
    validations:
      required: false
